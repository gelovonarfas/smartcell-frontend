<!-- ============================================================
     B01 · Хиро
     figma: node-id=4:289
     Формулировки клиники 2026-09-28: надзаголовок «Річна програма-подорож»,
     заголовок «Face Control 365» (без «Це я. Це моє.» — фраза уедет в блок
     про собственные клетки), дескриптор из трёх коротких фраз. Подпись
     «Регенеративна естетична медицина · VIRTUS» переехала из надзаголовка
     к фактам справа; в фактах сначала число, потом подпись.
     Надписи пишутся обычным регистром — капс даёт класс sc-t-caption.
     ACF: hero_video (file), hero_poster (image), hero_eyebrow (text),
          hero_title (text), hero_subtitle (textarea), hero_brand (text),
          hero_cta_label (text), hero_cta_link (link),
          hero_facts (repeater: value, label)
     Цифры (10+, 3000+) согласованы клиникой 2026-09-04. Факт про 13 стран
     из хиро убран 2026-09-14: в шапке он читался без опоры на контекст.
     Он остался в блоке B08 «Наука не хайп», где стоит рядом с пояснением.
     Хедер (B00b) лежит поверх отдельной секцией, здесь не дублируется.
     ============================================================ -->
<section class="sc-hero" data-theme="inverse" data-hero>

  <div class="sc-hero__bg" aria-hidden="true">
    <!-- Постер — обычная картинка под видео, а не атрибут poster: так браузер
         выбирает кадр под экран сам, без скрипта, и рисует его сразу после
         стилей. С poster= мобильный кадр подставлял video-lazy.js, а скрипты
         с defer ждут загрузки CSS — LCP уезжал на 2 с (PSI, 2026-09-22).
         Видео стартует поверх и закрывает картинку. -->
    <picture class="sc-hero__poster">
      <source media="(max-width: 640px)" srcset="assets/img/hero-poster-mob.jpg" width="720" height="1280">
      <img src="assets/img/hero-poster.jpg" alt="" width="1280" height="720"
           fetchpriority="high" decoding="async">
    </picture>
    <video class="sc-hero__video" autoplay muted loop playsinline
           width="1280" height="720" preload="metadata" tabindex="-1">
      <!-- Телефон: вертикальный кадр 720×1280; выбор по data-media делает
           assets/js/video-lazy.js — media у <source> в <video> браузеры не читают -->
      <source data-src="assets/video/hero-mob.mp4" data-media="(max-width: 640px)" type="video/mp4">
      <source data-src="assets/video/hero.mp4" type="video/mp4">
    </video>
    <span class="sc-hero__scrim sc-hero__scrim--top"></span>
    <span class="sc-hero__scrim sc-hero__scrim--bottom"></span>
  </div>

  <div class="sc-hero__inner">

    <div class="sc-hero__copy">
      <p class="sc-hero__eyebrow sc-t-caption">Річна програма-подорож</p>
      <h1 class="sc-hero__title sc-t-display">Face Control 365</h1>
      <p class="sc-hero__lead sc-t-body">Глибока діагностика. Персональний протокол. Здорова і доглянута шкіра.</p>
    </div>

    <div class="sc-hero__aside">
      <div class="sc-hero__proof">
        <p class="sc-hero__brand sc-t-caption">Регенеративна естетична медицина&nbsp;·&nbsp;VIRTUS</p>
        <ul class="sc-hero__facts">
          <li class="sc-hero__fact">
            <p class="sc-hero__fact-value sc-t-stat">10+</p>
            <p class="sc-hero__fact-label sc-t-caption">років досліджень</p>
          </li>
          <li class="sc-hero__fact">
            <p class="sc-hero__fact-value sc-t-stat">3000+</p>
            <p class="sc-hero__fact-label sc-t-caption">пацієнтів пройшли програму</p>
          </li>
        </ul>
      </div>

      <a class="sc-hero__cta is-glass" href="#journey">
        <span class="sc-hero__cta-label">Почати свою програму</span>
        <span class="sc-hero__cta-arrow"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M2 12H22M14.7 19.3L22 12L14.7 4.7" stroke="currentColor" stroke-width="1"/></svg></span>
      </a>
    </div>

  </div>
</section>
