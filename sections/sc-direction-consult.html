<section class="sc-dconsult" id="direction-consult" data-theme="inverse">
  <!-- Сборка как B11 на Face Control (правка 2026-10-06): кадр под скримом с запасом
       под медленный скролл (gsap-animations.js, --dconsult-parallax), внутри —
       сетка 473/743: слева надпись и заголовок, справа кнопка. Кадр — тот же,
       что в B11, но отзеркален: планета у правого края (assets/img/direction/consult-bg*.jpg).
       Абзац «Прийом веде керівник клініки…» снят — см. комментарий ниже. -->
  <div class="sc-dconsult__bg" aria-hidden="true">
    <img class="sc-dconsult__image"
         data-src="assets/img/direction/consult-bg.jpg"
         data-srcset="assets/img/direction/consult-bg.jpg 1440w, assets/img/direction/consult-bg@2x.jpg 1672w"
         sizes="100vw" alt="" width="1440" height="585" loading="lazy" decoding="async">
    <span class="sc-dconsult__scrim"></span>
  </div>

  <div class="sc-dconsult__inner">
    <div class="sc-dconsult__copy">
      <p class="sc-dconsult__kicker sc-t-caption">Консультація</p>
      <h2 class="sc-dconsult__title sc-t-h2">Лікування стовбуровими клітинами починається з консультації</h2>
      <!-- Снято 2026-10-06 (сборка как B11 — без абзаца):
      <p class="sc-dconsult__text sc-t-body">Прийом веде керівник клініки, доктор медичних наук, професор Володимир Цепколенко. За потреби до консультації долучаються профільні фахівці — спільне рішення дозволяє обрати ефективну тактику лікування.</p>
      -->
    </div>

    <!-- Запис — у попапі, як на Face Control (sections/modal-booking.html, modal.js), 2026-10-04.
         Форма на сторінці знята; без скрипта ссылка просто остаётся на этой секции. -->
    <div class="sc-dconsult__action">
      <a class="sc-dconsult__cta" href="#direction-consult" data-modal-open="booking">Записатись на консультацію</a>
    </div>
  </div>

      <input class="sc-dconsult__input" id="dconsult-name" name="name" type="text"

    <p class="sc-dconsult__consent sc-t-mini">Надсилаючи форму, ви підтверджуєте згоду з політикою обробки персональних даних.</p>
